[package]
name = "archive"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
shared = { workspace = true }
signalr = { workspace = true }
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
