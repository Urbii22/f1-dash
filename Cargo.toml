[workspace]
members = ["shared", "realtime", "api", "simulator", "signalr", "archive"]
default-members = ["realtime", "api"]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
# internal crates
shared = { path = "shared" }
signalr = { path = "signalr" }

# shared third-party deps (versions/features owned here, crates inherit)
anyhow = "1.0.98"
axum = "0.8.4"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1"
futures = "0.3.31"
reqwest = { version = "0.13.1", features = ["native-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45.1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower-http = { version = "0.6.4", features = ["cors"] }
tracing = "0.1.41"

# shared dev deps
tempfile = "3.20"
